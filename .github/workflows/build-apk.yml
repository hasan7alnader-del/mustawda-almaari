name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js

      - run: npx cap add android

      - run: npx capacitor-assets generate --android

      - run: npx cap sync android

      - name: Increase Gradle download timeout
        run: |
          mkdir -p ~/.gradle
          echo "systemProp.org.gradle.internal.http.connectionTimeout=600000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=600000" >> ~/.gradle/gradle.properties

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: almaarri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
