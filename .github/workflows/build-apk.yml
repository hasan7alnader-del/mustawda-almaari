name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare Supabase
        run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js

      - name: Add Android
        run: npx cap add android

      - name: Generate app assets
        run: npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

     - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, re, sys
          s = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          s = re.sub(r'\s+', '', s)
          print("Secret length:", len(s))
          print("Invalid characters:", len(re.sub(r'[A-Za-z0-9+/=]', '', s)))
          try:
              data = base64.b64decode(s, validate=True)
              if not data:
                  raise ValueError("Empty keystore")
              os.makedirs("android/app", exist_ok=True)
              with open("android/app/release-key.jks", "wb") as f:
                  f.write(data)
              print("Keystore decoded successfully.")
          except Exception as e:
              print("Keystore decode failed:", type(e).__name__, str(e))
              sys.exit(1)
          PY

      - name: Configure release signing
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "$STORE_PASSWORD"
                      keyAlias "$KEY_ALIAS"
                      keyPassword "$KEY_PASSWORD"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: almaarri-signed-release
          path: android/app/build/outputs/apk/release/*.apk
