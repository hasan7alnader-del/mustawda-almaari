name: Extract Android Project

on:
  workflow_dispatch:
  push:
    paths:
      - "mustawda-almaarri-android.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o mustawda-almaarri-android.zip -d extracted

      - name: Copy project files
        run: |
          cp -a extracted/almaarri-app/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Android project" || echo "No changes"
          git push
