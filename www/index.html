.opt{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);font-size:14px;font-weight:700;color:rgba(255,255,255,.85);text-align:start}
.opt.on{border-color:#fff;background:rgba(255,255,255,.2);color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.after{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.09);font-size:13px;color:rgba(255,255,255,.8)}
.after b{font-size:15px;color:#fff}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:90;background:rgba(15,10,50,.94);border:1px solid rgba(255,255,255,.3);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .2s}
.ta{min-height:160px;direction:rtl;font-size:14px;line-height:1.7}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:none;opacity:1}}

<script>
"use strict";
/* ============ أدوات عامة ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
function hash(s){let h1=0xdeadbeef^7,h2=0x41c6ce57^7;s='sam|'+s;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toNum(v){if(typeof v==='number')return isFinite(v)?v:NaN;let s=String(v==null?'':v).trim();if(!s)return NaN;s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫]/g,'.').replace(/\s/g,'').replace(/^(-?\d+)[,،](\d{1,2})$/,'$1.$2').replace(/[,،٬]/g,'');if(!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
const toC=n=>Math.round(n*100);
function fmt(c){const neg=c<0,a=Math.abs(c);const w=Math.floor(a/100),f=a%100;let s=w.toLocaleString('en-US');if(f)s+='.'+String(f).padStart(2,'0');return(neg?'-':'')+s}
const CUR={USD:{n:'دولار',s:'$'},SYP:{n:'سوري',s:'ل.س'}};
function money(c,cur,withUnit=true){return`<span class="num">${fmt(c)}</span>`+(withUnit?`<small> ${CUR[cur].s}</small>`:'')}
const norm=s=>String(s==null?'':s).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,'').toLowerCase();
function toast(m){const r=$('#toastRoot');r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',Math.max(2600,String(m).length*70))}
/* ============ توثيق الإيميل (Firebase) ============ */
const FIREBASE_API_KEY='AIzaSyCFFQBcRB57p4BJlOyiBob9nvJrpvfHBjQ';
const FB=!!FIREBASE_API_KEY;
async function fb(ep,body){let r;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+FIREBASE_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){const x=new Error('NET');x.code='NET';x.detail=(e&&(e.name+': '+e.message))||'';throw x}
const j=await r.json().catch(()=>({}));if(!r.ok){const m=(j.error&&j.error.message)||'ERR';const x=new Error(m);x.code=String(m).split(' ')[0];throw x}return j}
const FBERR={EMAIL_EXISTS:'هذا الإيميل مسجّل مسبقاً. سجّل الدخول.',EMAIL_NOT_FOUND:'الحساب غير موجود. أنشئ حساباً جديداً.',INVALID_PASSWORD:'كلمة المرور غير صحيحة',INVALID_LOGIN_CREDENTIALS:'الإيميل أو كلمة المرور غير صحيحة',WEAK_PASSWORD:'كلمة المرور ضعيفة (6 أحرف على الأقل)',TOO_MANY_ATTEMPTS_TRY_LATER:'محاولات كثيرة. حاول لاحقاً.',USER_DISABLED:'تم تعطيل هذا الحساب',INVALID_EMAIL:'الإيميل غير صحيح',NET:'تعذر الاتصال بالإنترنت',OPERATION_NOT_ALLOWED:'تسجيل الدخول بالإيميل غير مفعّل في Firebase',API_KEY_INVALID:'مفتاح Firebase غير صحيح',CONFIGURATION_NOT_FOUND:'إعدادات Firebase غير مكتملة'};
const fbMsg=e=>(FBERR[e.code]||('تعذر إكمال العملية ('+e.code+')'))+(e.code==='NET'?' ['+(location.protocol==='file:'?'file':location.protocol)+(e.detail?' | '+e.detail:'')+']':'');
function busy(on){const b=document.querySelector('.btn.pri[data-act=login],.btn.pri[data-act=vfCheck]');if(b){b.disabled=on;b.style.opacity=on?.6:1}}
function finishLogin(em,pw,j){const U=getUsers();U[em]=hash(pw);setUsers(U);S.user=em;S.data=loadData(em);S.err='';S.mode='login';S.pend=null;LS.setItem('sam_session',em);if(j)setTok(j);cloudAfterLogin()}
async function fbAuth(em,pw,reg){busy(true);
try{
if(reg){let j;
try{j=await fb('signUp',{email:em,password:pw,returnSecureToken:true})}
catch(e){if(e.code!=='EMAIL_EXISTS')throw e;j=await fb('signInWithPassword',{email:em,password:pw,returnSecureToken:true});const l=await fb('lookup',{idToken:j.idToken});if(l.users&&l.users[0]&&l.users[0].emailVerified){S.mode='login';S.err='هذا الإيميل مفعّل مسبقاً. سجّل الدخول.';render();$('#em').value=em;return}}
await fb('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:j.idToken});S.pend={em,pw};S.err='';S.screen='verify';render();return}
const j=await fb('signInWithPassword',{email:em,password:pw,returnSecureToken:true});const l=await fb('lookup',{idToken:j.idToken});
if(!(l.users&&l.users[0]&&l.users[0].emailVerified)){S.pend={em,pw};S.err='حسابك غير مفعّل بعد. افتح رابط التحقق في بريدك.';S.screen='verify';render();return}
finishLogin(em,pw,j)}
catch(e){if(e.code==='NET'&&!reg){const U=getUsers();if(U[em]&&U[em]===hash(pw)){finishLogin(em,pw);return}}
S.err=fbMsg(e);render();const x=$('#em');if(x)x.value=em}}
async function fbVerifyCheck(){busy(true);try{const j=await fb('signInWithPassword',{email:S.pend.em,password:S.pend.pw,returnSecureToken:true});const l=await fb('lookup',{idToken:j.idToken});

if(wb&&rel){const sh=xml(wb).getElementsByTagName('sheet')[0];if(sh){const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
for(const r of xml(rel).getElementsByTagName('Relationship')){if(r.getAttribute('Id')===rid){let t=r.getAttribute('Target');path=t.startsWith('/')?t.slice(1):'xl/'+t}}}}
if(!path||!z[path])path=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
if(!path)throw new Error('لا توجد ورقة بيانات');
const doc=xml(await entryText(z,path));const rows=[];
for(const r of doc.getElementsByTagName('row')){const arr=[];let seq=0;
for(const c of r.getElementsByTagName('c')){const ref=c.getAttribute('r');let ci=seq;if(ref){const m=ref.match(/^([A-Z]+)/);if(m){ci=0;for(const ch of m[1])ci=ci*26+ch.charCodeAt(0)-64;ci--}}seq=ci+1;
const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
if(t==='s')val=shared[parseInt(v?v.textContent:'0')]||'';
else if(t==='inlineStr'){const is=c.getElementsByTagName('is')[0];val=is?is.textContent:''}
else if(v){val=(t==='str'||t==='e'||t==='b')?v.textContent:parseFloat(v.textContent)}
arr[ci]=val}
for(let i=0;i<arr.length;i++)if(arr[i]===undefined)arr[i]='';
rows.push(arr)}
return rows}
function parseCsv(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const d=[',',';','\t'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
const rows=[];let row=[],cur='',q=false;
for(let i=0;i<text.length;i++){const ch=text[i];
if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}
else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
else cur+=ch}
if(cur!==''||row.length){row.push(cur);rows.push(row)}
return rows.filter(r=>r.some(c=>String(c).trim()!==''))}

/* ============ استيراد الصيدليات ============ */
function importRows(rows){
let hi=rows.findIndex(r=>r.some(c=>{const n=norm(c);return n.includes('صيدليه')||n.includes('اسم')}));
let cn=-1,cc=-1,cu=-1,cs=-1,start,hdr=[];
const U_=['دولار','usd','$','dollar'],S_=['سوري','ليره','syp','ل.س','سوريه','lira'];
const has=(x,k)=>k.some(w=>x.includes(w));
if(hi>=0){const h=rows[hi].map(norm);hdr=rows[hi];start=hi+1;
cn=h.findIndex(x=>x.includes('صيدليه')||x.includes('اسم'));
cc=h.findIndex((x,i)=>i!==cn&&(x.includes('مدينه')||x.includes('موقع')||x.includes('city')||x.includes('منطقه')));
const bad=x=>x.includes('فواتير')||x.includes('فاتور')||x.includes('دفع')||x.includes('مدفوع');
const pick=K=>{let c=h.findIndex(x=>has(x,K)&&(x.includes('رصيد')||x.includes('دين')||x.includes('باقي')||x.includes('متبقي')||x.includes('balance')));if(c<0)c=h.findIndex(x=>has(x,K)&&!bad(x));return c};
cu=pick(U_);cs=pick(S_);
if(cu<0&&cs<0){const used=new Set([cn,cc]);const cand=[];
for(let c=0;c<h.length;c++){if(used.has(c))continue;if(rows.slice(start).some(r=>r[c]!==''&&r[c]!=null&&!isNaN(toNum(r[c]))))cand.push(c)}
if(cand.length>=1)cu=cand[0];if(cand.length>=2)cs=cand[1]}}
else{start=isNaN(toNum(rows[0]&&rows[0][0]))&&rows[0]&&rows.length>1&&isNaN(toNum(rows[0][2]))?1:0;cn=0;cc=1;cu=2;cs=3;hdr=rows[0]||[]}
if(cn<0)throw new Error('لم أجد عمود اسم الصيدلية');
let added=0,skipped=0,updated=0,empty=0,withBal=0;const dt=today();
for(let i=start;i<rows.length;i++){const r=rows[i];const name=String(r[cn]==null?'':r[cn]).trim();
if(!name){empty++;continue}
if(norm(name)==='الاجمالي'||norm(name)==='المجموع')continue;
const city=cc>=0?String(r[cc]==null?'':r[cc]).trim():'';
const txs=[];
for(const [col,cur] of [[cu,'USD'],[cs,'SYP']]){if(col<0)continue;const raw=r[col];if(raw===''||raw==null)continue;const v=toNum(raw);if(isNaN(v)||v===0)continue;
txs.push({id:uid(),type:v>0?'inv':'pay',cur,c:Math.abs(toC(v)),date:dt,note:'رصيد سابق (استيراد)',seq:txs.length+1})}
const ex=S.data.pharmacies.find(p=>norm(p.name)===norm(name)&&norm(p.city)===norm(city));
if(ex){if(!ex.txs.length&&txs.length){ex.txs=txs;updated++;withBal++}else skipped++;continue}
S.data.pharmacies.push({id:uid(),name,city,txs});added++;if(txs.length)withBal++}
if(added||updated)save();
const nm=c=>c>=0?String(hdr[c]==null?'':hdr[c]).trim()||('عمود '+(c+1)):'';
return{added,skipped,updated,empty,withBal,usdCol:nm(cu),sypCol:nm(cs),cols:hdr.map(x=>String(x)).filter(Boolean).join(' | ')}}

/* ============ تسليم الملفات ============ */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function nativeShare(blob,name,title,text){const P=Capacitor.Plugins;const w=await P.Filesystem.writeFile({path:name,data:await blobB64(blob),directory:'CACHE'});
await P.Share.share({title:title||name,text:text||'',files:[w.uri],dialogTitle:title||name})}
const isCancel=e=>/cancel/i.test(String(e&&(e.message||e.errorMessage||e)));
async function deliver(blob,name,title){
if(isNative()){try{await nativeShare(blob,name,title);return 'shared'}catch(e){if(isCancel(e))return 'cancel';toast('تعذرت المشاركة: '+((e&&e.message)||e));return 'error'}}
try{const file=new File([blob],name,{type:blob.type});
if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title||name});return 'shared'}}
catch(e){if(e&&e.name==='AbortError')return 'cancel'}
dl(blob,name);return 'downloaded'}

/* ============ النماذج ============ */
const CITIES=['إدلب','سرمدا','حلب','دمشق','ريف دمشق','حمص','حماة','اللاذقية','طرطوس','درعا','دير الزور','الرقة','الحسكة','السويداء','القنيطرة','أريحا','معرة النعمان','جسر الشغور','الدانا','حارم','الأتارب','عفرين','اعزاز','الباب','جرابلس'];
function phForm(p){const cities=[...new Set([...S.data.pharmacies.map(x=>x.city).filter(Boolean),...CITIES])];
openModal(`${sheetHead('store','g-violet',p?'تعديل الصيدلية':'صيدلية جديدة')}
<label class="f">اسم الصيدلية</label><input id="phn" value="${esc(p?p.name:'')}" maxlength="60" placeholder="مثال: صيدلية الشفاء">
<label class="f">الموقع (المدينة)</label><input id="phc" list="cl" value="${esc(p?p.city:'')}" maxlength="40" placeholder="مثال: إدلب"><datalist id="cl">${cities.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
<div id="merr"></div><div style="height:16px"></div><button class="btn pri" data-act="phSave" data-id="${p?p.id:''}"><span>حفظ</span>${ic('check')}</button>`);
setTimeout(()=>{const e=$('#phn');if(e&&!p)e.focus()},60)}
function pickPharmacy(title,cb){pickPharmacy.cb=cb;
if(!S.data.pharmacies.length){toast('أضف صيدلية أولاً');phForm();return}
openModal(`${sheetHead('search','g-cyan',title)}<div style="height:10px"></div><input id="pq" placeholder="ابحث باسم الصيدلية أو المدينة" autocomplete="off"><div style="height:10px"></div><div id="pl">${pickList('')}</div>`);
setTimeout(()=>{const e=$('#pq');if(e)e.focus()},60)}
function pickList(q){q=norm(q);let ps=S.data.pharmacies.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));if(q)ps=ps.filter(p=>norm(p.name).includes(q)||norm(p.city).includes(q));
return ps.length?ps.map(p=>`<button class="glass row" data-act="pick" data-id="${p.id}">${gem(gemFor(p),ic('store'),'sm')}<div class="m"><div class="n">${esc(p.name)}</div><div class="c">${ic('pin')}<span>${esc(p.city||'بدون مدينة')}</span></div></div></button>`).join(''):'<div class="empty"><p>لا توجد نتائج</p></div>'}
let TX={};
function txForm(pid,tid){const p=findP(pid);const t=tid?p.txs.find(x=>x.id===tid):null;
TX={pid,tid:tid||null,kind:t?t.type+':'+t.cur:'inv:USD'};
const opts=[['inv:USD','فاتورة دولار','g-rose','up'],['pay:USD','دفعة دولار','g-mint','down'],['inv:SYP','فاتورة سوري','g-gold','up'],['pay:SYP','دفعة سوري','g-cyan','down']];
openModal(`${sheetHead('fileText','g-mint',t?'تعديل حركة':'حركة جديدة')}
<div class="pin">${ic('store')} <b style="color:#fff">${esc(p.name)}</b> • ${ic('pin')} ${esc(p.city||'بدون مدينة')}</div>
<label class="f">التاريخ</label><input id="txd" type="date" value="${t?esc(t.date):today()}">
<label class="f">النوع</label><div class="opts">${opts.map(o=>`<button class="opt${TX.kind===o[0]?' on':''}" data-act="kind" data-k="${o[0]}">${gem(o[2],ic(o[3]),'xs')}<span>${o[1]}</span></button>`).join('')}</div>
<label class="f">المبلغ</label><input id="txa" inputmode="decimal" autocomplete="off" placeholder="0" value="${t?esc(String(t.c/100)):''}" dir="ltr" style="text-align:start;font-size:20px;font-weight:700">
<label class="f">البيان</label><textarea id="txn" rows="2" maxlength="200" placeholder="مثال: بضاعة، دفعة نقداً…">${t?esc(t.note||''):''}</textarea>
<div class="after"><span>الرصيد بعد الحفظ</span><b id="aft"></b></div><div id="merr"></div><div style="height:14px"></div>
<div class="btns" style="margin:0"><button class="btn pri" data-act="txSave"><span>حفظ</span>${ic('check')}</button>${t?`<button class="btn dng" style="width:auto;padding:14px 18px" data-act="txDel" aria-label="حذف">${ic('trash')}</button>`:''}</div>`);
updAfter()}
function updAfter(){const el=$('#aft');if(!el)return;const p=findP(TX.pid);const[type,cur]=TX.kind.split(':');
let bal=totals(p,cur).bal;if(TX.tid){const o=p.txs.find(x=>x.id===TX.tid);if(o&&o.cur===cur)bal-=o.type==='inv'?o.c:-o.c}
const v=toNum($('#txa')?$('#txa').value:'');const c=isNaN(v)?0:Math.abs(toC(v));bal+=type==='inv'?c:-c;el.innerHTML=balHtml(bal,cur)}
function cloudBox(){if(!CLOUD)return'<p class="hint" style="margin-top:0">☁️ المزامنة السحابية غير مفعّلة في هذه النسخة.</p>';
const l=+LS.getItem('sam_cloud_last:'+S.user)||0,ds=l?new Date(l).toLocaleString('ar-SY'):'لم تتم بعد';
return`<p class="hint" style="margin-top:0">☁️ <b>المزامنة السحابية مفعّلة</b>: بياناتك تُحفظ تلقائياً على حسابك. سجّل الدخول بنفس الإيميل من أي جوال لتعود كل بياناتك.<br>آخر مزامنة: ${esc(ds)}${CL.err?'<br><b style="color:#ff7a7a">'+esc(CL.lastErr||'')+'</b>':''}</p><button class="btn pri" data-act="syncNow"><span>مزامنة الآن</span>${ic('restore')}</button><div style="height:10px"></div>`}
function backupSheet(){const last=S.data.lastBackup?new Date(S.data.lastBackup).toLocaleString('ar-SY'):'لم تُحفظ بعد';
openModal(`${sheetHead('mail','g-pink','نسخة احتياطية')}
${cloudBox()}<p class="hint">آخر نسخة يدوية: ${esc(last)}<br>تُجهَّز نسخة كاملة من بياناتك وتُرسَل إلى بريدك الإلكتروني كمرفق.</p>
<label class="f" style="margin-top:4px">أرسل إلى</label><input id="bem" type="email" inputmode="email" value="${esc(S.user)}" dir="ltr" style="text-align:start">
<div style="height:14px"></div><button class="btn pri" data-act="bkMail"><span>إرسال النسخة إلى الإيميل</span>${ic('mail')}</button>
<div class="btns"><button class="btn sec2" data-act="bkFile">${ic('exp')}<span>حفظ كملف</span></button><button class="btn sec2" data-act="bkRestore">${ic('restore')}<span>استعادة</span></button></div>`)}
function importSheet(){openModal(`${sheetHead('imp','g-gold','استيراد من Excel')}
<p class="hint">اختر ملف Excel (‎.xlsx‎) أو CSV فيه الأعمدة:<br><b>اسم الصيدلية — المدينة — الرصيد دولار — الرصيد سوري</b><br>الأرصدة اختيارية، وتُسجَّل كرصيد سابق. الصيدليات الموجودة (نفس الاسم والمدينة) تُتخطّى. يمكنك أيضاً استيراد ملف الجرد الذي صدّره التطبيق.</p>
<button class="btn pri" data-act="pickFile" data-kind="import"><span>اختيار ملف</span>${ic('imp')}</button>
<div class="btns"><button class="btn sec2" data-act="tpl">${ic('table')}<span>تحميل نموذج فارغ</span></button></div>`)}

/* ============ النسخ الاحتياطي ============ */
function backupBlob(){return new Blob([JSON.stringify({app:'sam',v:1,email:S.user,date:new Date().toISOString(),data:S.data})],{type:'application/json'})}
async function doBackupMail(){const to=($('#bem')?$('#bem').value:S.user).trim();
if(!/^\S+@\S+\.\S+$/.test(to)){$('#merr')||0;toast('اكتب إيميلاً صحيحاً');return}
const name=`sam-backup-${today()}.json`,blob=backupBlob();
const prevBk=S.data.lastBackup;S.data.lastBackup=Date.now();save();
if(isNative()){try{await nativeShare(blob,name,'نسخة احتياطية - SAM','نسخة احتياطية من تطبيق SAM. أرسلها إلى: '+to);hideModal();render();toast('تم تجهيز النسخة الاحتياطية')}
catch(e){S.data.lastBackup=prevBk;save();if(!isCancel(e))toast('تعذرت المشاركة: '+((e&&e.message)||e))}return}
let r='';try{const file=new File([blob],name,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'نسخة احتياطية - SAM',text:'نسخة احتياطية من تطبيق SAM. أرسلها إلى: '+to});r='shared'}}catch(e){if(e&&e.name==='AbortError'){S.data.lastBackup=S.data.lastBackup;return}}
if(r!=='shared'){dl(blob,name);const body='مرفق نسخة احتياطية من تطبيق SAM.\nأرفق الملف '+name+' (تم حفظه في التنزيلات) ثم أرسل الرسالة.';
setTimeout(()=>{location.href='mailto:'+encodeURIComponent(to).replace('%40','@')+'?subject='+encodeURIComponent('نسخة احتياطية - SAM '+today())+'&body='+encodeURIComponent(body)},500)}
hideModal();render();toast('تم تجهيز النسخة الاحتياطية')}
async function restoreFrom(text){let j;try{j=JSON.parse(text)}catch(e){throw new Error('الملف ليس نسخة احتياطية صالحة')}
if(!j||j.app!=='sam'||!j.data||!Array.isArray(j.data.pharmacies))throw new Error('الملف ليس نسخة احتياطية من SAM');
const ok=await confirmBox(`سيتم استبدال البيانات الحالية بالنسخة المحفوظة (${j.data.pharmacies.length} صيدلية). هل تريد المتابعة؟`,'استعادة',true);if(!ok)return false;
S.data={dist:j.data.dist||'',pharmacies:j.data.pharmacies,lastBackup:j.data.lastBackup||null};save();return true}

/* ============ الأحداث ============ */
async function handleFile(f){const kind=handleFile.kind;if(!f)return;
try{if(kind==='restore'){const ok=await restoreFrom(await f.text());if(ok){hideModal();render();toast('تمت الاستعادة')}return}
let rows;if(/\.csv$/i.test(f.name)||f.type==='text/csv')rows=parseCsv(await f.text());else rows=await readXlsx(await f.arrayBuffer());
const r=importRows(rows);hideModal();render();
let m=[];if(r.added)m.push(`أُضيفت ${r.added} صيدلية`);if(r.updated)m.push(`حُدّثت أرصدة ${r.updated} صيدلية موجودة`);if(r.skipped)m.push(`تخطّي ${r.skipped} موجودة`);
if(!m.length)m.push('لم أجد صفوفاً للاستيراد');
if(r.added+r.updated>0){m.push(r.withBal?`الأرصدة: دولار من «${r.usdCol||'—'}»، سوري من «${r.sypCol||'—'}»`:`بدون أرصدة. أعمدة الملف: ${r.cols}`)}
toast(m.join(' • '))}
catch(e){toast(e.message||'تعذر قراءة الملف')}}
document.addEventListener('change',e=>{if(e.target.id==='fileIn'){const f=e.target.files[0];e.target.value='';handleFile(f)}});
document.addEventListener('input',e=>{const id=e.target.id;
if(id==='q'){S.q=e.target.value;$('#plist').innerHTML=listHtml()}
else if(id==='pq')$('#pl').innerHTML=pickList(e.target.value);
else if(id==='txa')updAfter();if(id==='txa'||id==='phn'||id==='phc'||id==='txn'){const m=$('#merr');if(m)m.innerHTML=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const a=S.screen;if(a==='login')act('login');else if(a==='dist')act('distGo')}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
if(el.dataset.act==='ovclose'&&e.target.closest('.sheet')&&!e.target.closest('.x'))return;act(el.dataset.act,el.dataset)});
function setErr(id,m){const e=$(id);if(e)e.innerHTML=m?`<div class="err">${esc(m)}</div>`:''}
async function act(a,d={}){switch(a){
case'toggleMode':{const e0=$('#em')?$('#em').value:'';S.mode=S.mode==='login'?'reg':'login';S.err='';render();$('#em').value=e0;break}
case'login':{const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
if(!/^\S+@\S+\.\S+$/.test(em)){S.err='اكتب بريداً إلكترونياً صحيحاً';render();$('#em').value=em;break}
if(pw.length<4){S.err='كلمة المرور قصيرة (4 أحرف على الأقل)';render();$('#em').value=em;break}
if(FB){if(pw.length<6){S.err='كلمة المرور 6 أحرف على الأقل';render();$('#em').value=em;break}
if(S.mode==='reg'&&pw!==$('#pw2').value){S.err='كلمتا المرور غير متطابقتين';render();$('#em').value=em;break}
await fbAuth(em,pw,S.mode==='reg');break}
const U=getUsers();
if(S.mode==='reg'){if(U[em]){S.err='هذا الحساب موجود. سجّل الدخول.';render();$('#em').value=em;break}
if(pw!==$('#pw2').value){S.err='كلمتا المرور غير متطابقتين';render();$('#em').value=em;break}
U[em]=hash(pw);setUsers(U)}
else{if(!U[em]){S.err='الحساب غير موجود. أنشئ حساباً جديداً.';render();$('#em').value=em;break}
if(U[em]!==hash(pw)){S.err='كلمة المرور غير صحيحة';render();$('#em').value=em;break}}
S.user=em;S.data=loadData(em);S.err='';S.mode='login';LS.setItem('sam_session',em);S.screen='dist';render();break}
case'vfCheck':await fbVerifyCheck();break;
case'vfResend':await fbResend();break;
case'vfBack':S.pend=null;S.err='';S.mode='login';S.screen='login';render();break;
case'forgot':await fbForgot();break;
case'logout':if(await confirmBox('تسجيل الخروج من الحساب؟','خروج')){if(CLOUD&&LS.getItem('sam_dirty:'+S.user)==='1'){toast('جارٍ حفظ بياناتك في السحابة...');await cloudFlush()}LS.removeItem('sam_session');LS.removeItem('sam_rt:'+S.user);CL.t=null;CL.uid=null;S.user=null;S.data=null;S.screen='login';S.q='';S.searchOpen=false;render()}break;
case'editDist':S.screen='dist';render();break;
case'distGo':{const v=$('#dist').value.trim();if(!v){S.err='اكتب اسم الموزع';render();break}S.err='';S.data.dist=v;save();S.screen='home';render();break}
case'toggleSearch':S.searchOpen=!S.searchOpen;if(!S.searchOpen)S.q='';render();if(S.searchOpen){const e=$('#q');if(e)e.focus()}break;
case'open':S.pid=d.id;S.filter='all';S.screen='stmt';render();break;
case'back':S.screen='home';render();break;
case'filter':S.filter=d.f;render();break;
case'tStmt':pickPharmacy('اختر الصيدلية',id=>{hideModal();S.pid=id;S.filter='all';S.screen='stmt';render()});break;
case'tTx':pickPharmacy('حركة لأي صيدلية؟',id=>txForm(id));break;
case'pick':{const cb=pickPharmacy.cb;if(cb)cb(d.id);break}
case'newtx':txForm(d.id);break;
case'edittx':txForm(S.pid,d.id);break;
case'addph':phForm();break;
case'editph':phForm(findP(S.pid));break;
case'phSave':{const n=$('#phn').value.trim(),c=$('#phc').value.trim();if(!n){setErr('#merr','اكتب اسم الصيدلية');break}
if(S.data.pharmacies.some(p=>p.id!==d.id&&norm(p.name)===norm(n)&&norm(p.city)===norm(c))){setErr('#merr','هذه الصيدلية موجودة مسبقاً بنفس المدينة');break}
if(d.id){const p=findP(d.id);p.name=n;p.city=c}else{const p={id:uid(),name:n,city:c,txs:[]};S.data.pharmacies.push(p)}
save();hideModal();render();toast('تم الحفظ');break}
case'editphRow':{const p=findP(d.id);if(p)phForm(p);break}
case'delphRow':{const p=findP(d.id);if(p&&await confirmBox(`حذف «${p.name}» وكل فواتيرها ودفعاتها نهائياً؟`,'حذف',true)){S.data.pharmacies=S.data.pharmacies.filter(x=>x.id!==p.id);save();render();toast('تم حذف الصيدلية')}break}
case'delall':{const n=S.data.pharmacies.length;if(!n)break;
if(!await confirmBox(`حذف جميع الصيدليات (${n}) مع كل فواتيرها ودفعاتها؟ يُنصح بحفظ نسخة احتياطية أولاً.`,'متابعة',true))break;
if(!await confirmBox('تأكيد أخير: لا يمكن التراجع عن الحذف. حذف الكل؟','نعم، احذف الكل',true))break;
S.data.pharmacies=[];save();S.q='';render();toast('تم حذف جميع الصيدليات');break}
case'deltx':{const p=findP(S.pid);if(p&&await confirmBox('حذف هذه الحركة؟','حذف',true)){p.txs=p.txs.filter(t=>t.id!==d.id);save();render();toast('تم حذف الحركة')}break}
case'delph':{const p=findP(S.pid);if(await confirmBox(`حذف «${p.name}» وكل فواتيرها ودفعاتها نهائياً؟`,'حذف',true)){S.data.pharmacies=S.data.pharmacies.filter(x=>x.id!==p.id);save();S.screen='home';render();toast('تم الحذف')}break}
case'kind':TX.kind=d.k;document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===d.k));updAfter();break;
case'txSave':{const p=findP(TX.pid),v=toNum($('#txa').value),date=$('#txd').value;
if(isNaN(v)||v<=0){setErr('#merr','اكتب مبلغاً صحيحاً أكبر من صفر');break}
if(!date){setErr('#merr','اختر التاريخ');break}
const[type,cur]=TX.kind.split(':'),note=$('#txn').value.trim();
if(TX.tid){const t=p.txs.find(x=>x.id===TX.tid);Object.assign(t,{type,cur,c:toC(v),date,note})}
else{const seq=p.txs.reduce((m,t)=>Math.max(m,t.seq||0),0)+1;p.txs.push({id:uid(),type,cur,c:toC(v),date,note,seq})}
save();hideModal();render();toast('تم الحفظ');break}
case'txDel':{const p=findP(TX.pid);if(await confirmBox('حذف هذه الحركة؟','حذف',true)){p.txs=p.txs.filter(t=>t.id!==TX.tid);save();hideModal();render();toast('تم الحذف')}break}
case'share':{const p=findP(S.pid),t=stmtText(p);
try{if(navigator.share){await navigator.share({title:'كشف حساب '+p.name,text:t});break}}catch(e){if(e&&e.name==='AbortError')break}
openModal(`${sheetHead('share','g-cyan','بيان الحساب')}<div style="height:8px"></div><textarea class="ta" id="stx" readonly>${esc(t)}</textarea><div style="height:12px"></div><button class="btn pri" data-act="copyTx"><span>نسخ النص</span></button>`);break}
case'copyTx':{const el=$('#stx');try{await navigator.clipboard.writeText(el.value);toast('تم النسخ')}catch(e){el.select();document.execCommand('copy');toast('تم النسخ')}break}
case'xlsPh':{const p=findP(S.pid);await deliver(buildStatement(p),`كشف-حساب-${p.name}-${today()}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'),'كشف حساب');break}
case'export':if(!S.data.pharmacies.length){toast('لا توجد بيانات للتصدير');break}await deliver(buildInventory(),`جرد-${(S.data.dist||'SAM').replace(/[\\/:*?"<>|]/g,'_')}-${today()}.xlsx`,'جرد كلي');break;
case'import':importSheet();break;
case'tpl':await deliver(buildTemplate(),'نموذج-استيراد-الصيدليات.xlsx','نموذج');break;
case'pickFile':handleFile.kind=d.kind;$('#fileIn').click();break;
case'backup':backupSheet();break;
case'bkMail':await doBackupMail();break;
case'syncNow':{toast('جارٍ المزامنة...');const r=await cloudSyncAuth();if(r==='err')toast(CL.lastErr);else{toast(r==='pulled'||r==='merged'?'تم تحديث بياناتك من السحابة':'تمت المزامنة ✓');if(r==='pulled'||r==='merged'){hideModal();render()}else backupSheet()}break}
case'bkFile':{S.data.lastBackup=Date.now();save();await deliver(backupBlob(),`sam-backup-${today()}.json`,'نسخة احتياطية');hideModal();render();break}
case'bkRestore':handleFile.kind='restore';$('#fileIn').click();break;
case'ovclose':hideModal();break;
case'dlgok':closeDlg(true);break;
case'dlgno':closeDlg(false);break}}

/* ============ زر الرجوع ============ */
history.replaceState({r:1},'');history.pushState({a:1},'');
window.addEventListener('popstate',()=>{
if(dlgResolve){closeDlg(false);history.pushState({a:1},'');return}
if(modalOpen){hideModal();history.pushState({a:1},'');return}
if(S.screen==='verify'){S.pend=null;S.err='';S.screen='login';render();history.pushState({a:1},'');return}
if(S.screen==='stmt'){S.screen='home';render();history.pushState({a:1},'');return}
if(S.screen==='dist'&&S.user){S.screen='home';render();history.pushState({a:1},'');return}
});

/* ============ البدء ============ */
(function boot(){const em=LS.getItem('sam_session');
if(em&&getUsers()[em]){S.user=em;S.data=loadData(em);S.screen=S.data.dist?'home':'dist'}
render();
if(em&&S.user&&CLOUD)cloudSyncAuth().then(r=>{if(r==='pulled'||r==='merged'){S.screen=S.data.dist?(S.screen==='dist'?'home':S.screen):'dist';render();toast('تم تحديث بياناتك من السحابة')}})})();
window.__sam={FB,S,totals,grand,importRows,readXlsx,parseCsv,buildInventory,buildStatement,buildTemplate,stmtText,fmt,toNum,toC,act,render,hash};
</script>
